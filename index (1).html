<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member - Dice Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a2e; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #16213e; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 450px; width: 100%; }
        h1 { color: #e94560; margin-bottom: 10px; }
        .login-box { margin-top: 20px; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #0f3460; background: #0f3460; color: #fff; text-align: center; font-size: 16px; outline: none; }
        .info-panel { background: #0f3460; padding: 15px; border-radius: 10px; margin: 20px 0; }
        .info-panel p { margin: 5px 0; font-size: 16px; }
        .highlight { color: #f8b500; font-weight: bold; font-size: 18px; }
        .dice-container { display: flex; justify-content: center; gap: 15px; margin: 25px 0; }
        .dice { width: 65px; height: 65px; background: #fff; color: #1a1a2e; font-size: 32px; font-weight: bold; display: flex; justify-content: center; align-items: center; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .roll-animation { animation: roll 0.6s ease-in-out; }
        @keyframes roll { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
        button { background: #e94560; color: #fff; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #ff6b81; }
        button:disabled { background: #555; cursor: not-allowed; }
        .status-msg { margin-top: 15px; font-size: 16px; min-height: 24px; font-weight: bold; }
        .win { color: #4ecc71; }
        .lose { color: #e74c3c; }
        .user-tag { color: #38bdf8; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Dice Game</h1>

    <!-- Login Screen -->
    <div id="login-section" class="login-box">
        <p style="margin-bottom: 10px;">Username ရိုက်ထည့်ပါ</p>
        <input type="text" id="username-input" placeholder="Enter Username...">
        <button onclick="loginUser()">Game သို့ ဝင်မည်</button>
    </div>

    <!-- Game Screen -->
    <div id="game-section" style="display: none;">
        <div class="user-tag">Player: <span id="display-username"></span></div>
        <div class="info-panel">
            <p>Target Numbers: <span id="target-display" class="highlight">- - -</span></p>
            <p>Remaining Spins: <span id="spins-left" class="highlight">0</span></p>
        </div>

        <div class="dice-container">
            <div class="dice" id="dice1">1</div>
            <div class="dice" id="dice2">1</div>
            <div class="dice" id="dice3">1</div>
        </div>

        <button id="roll-btn" onclick="rollDice()">Spin Dice</button>
        <div class="status-msg" id="status-text"></div>
    </div>
</div>

<script>
    let currentUser = "";

    function getAdminData() {
        const data = localStorage.getItem('diceGameAdmin');
        return data ? JSON.parse(data) : { target: [1, 2, 3], userSettings: {} };
    }

    function saveAdminData(data) {
        localStorage.setItem('diceGameAdmin', JSON.stringify(data));
    }

    function loginUser() {
        const nameInput = document.getElementById('username-input').value.trim();
        if(!nameInput) {
            alert('Username ထည့်ပါ။');
            return;
        }
        currentUser = nameInput;
        document.getElementById('display-username').innerText = currentUser;
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('game-section').style.display = 'block';
        updateUI();
    }

    function getUserSpinsLeft(gameData) {
        if (gameData.userSettings && gameData.userSettings[currentUser]) {
            return gameData.userSettings[currentUser].spinsLeft || 0;
        }
        return 0;
    }

    function updateUI() {
        if(!currentUser) return;
        const gameData = getAdminData();
        const spins = getUserSpinsLeft(gameData);

        document.getElementById('target-display').innerText = gameData.target.join(' - ');
        document.getElementById('spins-left').innerText = spins;

        const btn = document.getElementById('roll-btn');
        if (spins <= 0) {
            btn.disabled = true;
            document.getElementById('status-text').innerText = "Spins finished or No Spins Allocated!";
            document.getElementById('status-text').className = "status-msg lose";
        } else {
            btn.disabled = false;
            document.getElementById('status-text').innerText = "";
        }
    }

    function rollDice() {
        let gameData = getAdminData();
        let userConfig = gameData.userSettings ? gameData.userSettings[currentUser] : null;

        if (!userConfig || userConfig.spinsLeft <= 0) return;

        const btn = document.getElementById('roll-btn');
        btn.disabled = true;

        const dice1 = document.getElementById('dice1');
        const dice2 = document.getElementById('dice2');
        const dice3 = document.getElementById('dice3');

        dice1.classList.add('roll-animation');
        dice2.classList.add('roll-animation');
        dice3.classList.add('roll-animation');

        setTimeout(() => {
            let res1, res2, res3;

            // Check if Admin set specific controlled numbers for this user
            if (userConfig.forcedDice && userConfig.forcedDice.length === 3) {
                res1 = userConfig.forcedDice[0];
                res2 = userConfig.forcedDice[1];
                res3 = userConfig.forcedDice[2];
                // Reset forced outcome after 1 forced roll (optional, clear to random afterward)
                userConfig.forcedDice = null;
            } else {
                // Random Roll if no forced numbers set
                res1 = Math.floor(Math.random() * 6) + 1;
                res2 = Math.floor(Math.random() * 6) + 1;
                res3 = Math.floor(Math.random() * 6) + 1;
            }

            dice1.innerText = res1;
            dice2.innerText = res2;
            dice3.innerText = res3;

            dice1.classList.remove('roll-animation');
            dice2.classList.remove('roll-animation');
            dice3.classList.remove('roll-animation');

            // Deduct spin count for this specific user
            userConfig.spinsLeft -= 1;
            gameData.userSettings[currentUser] = userConfig;
            saveAdminData(gameData);

            // Win Condition Check
            const isWin = (res1 === gameData.target[0] && res2 === gameData.target[1] && res3 === gameData.target[2]);
            const statusText = document.getElementById('status-text');

            if (isWin) {
                statusText.innerText = "Congratulations! You matched all numbers!";
                statusText.className = "status-msg win";
            } else {
                statusText.innerText = "Try again!";
                statusText.className = "status-msg lose";
            }

            recordResultToAdmin(currentUser, [res1, res2, res3], isWin);
            updateUI();
        }, 600);
    }

    function recordResultToAdmin(user, result, isWin) {
        let logs = JSON.parse(localStorage.getItem('diceGameLogs')) || [];
        const newLog = {
            username: user,
            rolled: result.join(' - '),
            status: isWin ? 'WIN' : 'LOSE',
            time: new Date().toLocaleTimeString()
        };
        logs.unshift(newLog);
        localStorage.setItem('diceGameLogs', JSON.stringify(logs));
    }

    window.addEventListener('storage', updateUI);
</script>

</body>
</html>
