<!DOCTYPE html>
<html lang="my"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>အန်စာတုံးဂိမ်း</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#111827;color:#f9fafb;text-align:center;padding:20px}
.card{max-width:380px;margin:auto;background:#1f2937;border-radius:16px;padding:20px}
input,button{font-size:18px;padding:12px;border-radius:10px;border:0;width:100%;box-sizing:border-box;margin-top:10px}
button{background:#f59e0b;font-weight:700;cursor:pointer}button:disabled{opacity:.4}
.row{display:flex;gap:10px;justify-content:center;margin:14px 0}
.die{width:80px;height:80px;background:#fff;color:#111;border-radius:14px;font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center}
.target .die{background:#10b981;color:#fff;width:60px;height:60px;font-size:32px}
#msg{font-size:22px;font-weight:700;min-height:30px}
.hide{display:none}
</style></head><body>
<div class="card">
<h2>🎲 အန်စာတုံးဂိမ်း</h2>
<div id="login">
<input id="uname" placeholder="Username ထည့်ပါ" autocapitalize="off">
<button onclick="login()">ဝင်မည်</button>
<p id="err" style="color:#f87171"></p>
</div>
<div id="game" class="hide">
<div>👤 <b id="me"></b> &nbsp; | &nbsp; Spins: <b id="spins">0</b></div>
<p>🎯 Target Number</p>
<div class="row target" id="target"></div>
<div class="row" id="dice"><div class="die">?</div><div class="die">?</div><div class="die">?</div></div>
<div id="msg"></div>
<button id="spinBtn" onclick="spin()">🎲 Spin</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
// ▼▼ Firebase Console > Project settings ကနေ ယူထားတဲ့ config ကို ဒီမှာ ထည့်ပါ ▼▼
const firebaseConfig = {
  apiKey: "AIzaSyCzhr0A8wwApcybklGOodu6LLp-DXSqg68",
  authDomain: "myleogame.firebaseapp.com",
  databaseURL: "https://myleogame-default-rtdb.firebaseio.com",
  projectId: "myleogame",
  storageBucket: "myleogame.firebasestorage.app",
  messagingSenderId: "1034042569283",
  appId: "1:1034042569283:web:674f8df8233c5787bc1af6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const authReady = firebase.auth().signInAnonymously();
let gameOpen = true;
let name = localStorage.getItem("dg_user"), user = null, target = "", busy = false;
const $ = id => document.getElementById(id);

function login(){
  const n = $("uname").value.trim().toLowerCase();
  if(!n) return;
  authReady.then(()=>db.ref("users/"+n).once("value")).then(s=>{
    if(!s.exists()){ $("err").textContent="ဒီ Username မရှိပါ။ Admin ပေးထားတဲ့ Username သုံးပါ။"; return; }
    localStorage.setItem("dg_user", n); name = n; start();
  });
}
function start(){
  $("login").classList.add("hide"); $("game").classList.remove("hide");
  $("me").textContent = name;
  db.ref("config/open").on("value", s=>{ gameOpen = s.val() !== false; refreshBtn(); if(!gameOpen) $("msg").textContent="⏸ ဂိမ်းကို ခေတ္တပိတ်ထားပါတယ်"; else if(!busy && !(user&&user.won)) $("msg").textContent=""; });
  db.ref("config/target").on("value", s=>{
    target = s.val() || "";
    $("target").innerHTML = target ? [...target].map(c=>`<div class="die">${c}</div>`).join("") : "<i>Admin မသတ်မှတ်သေးပါ</i>";
  });
  db.ref("users/"+name).on("value", s=>{
    user = s.val();
    if(!user){ localStorage.removeItem("dg_user"); location.reload(); return; }
    $("spins").textContent = user.spins || 0;
    refreshBtn();
    if(!busy && user.result) showDice(user.result);
    if(!busy) $("msg").textContent = user.won ? "🏆 နိုင်ပါပြီ!" : "";
  });
}
function refreshBtn(){ $("spinBtn").disabled = busy || !gameOpen || !user || !(user.spins > 0) || !target; }
function beep(f,d){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain(); o.frequency.value=f; g.gain.value=.15; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+d);}catch(e){} }
function confetti(){ for(let i=0;i<60;i++){ const e=document.createElement("div"); e.textContent=["🎉","✨","🎊","⭐"][i%4]; e.style.cssText=`position:fixed;top:-30px;left:${Math.random()*100}vw;font-size:${18+Math.random()*20}px;transition:transform ${2+Math.random()*2}s linear,opacity 3s;z-index:9`; document.body.appendChild(e); requestAnimationFrame(()=>{e.style.transform=`translateY(${105}vh) rotate(${Math.random()*720}deg)`;e.style.opacity=0}); setTimeout(()=>e.remove(),4500);} }
function showDice(r){ $("dice").innerHTML = [...r].map(c=>`<div class="die">${c}</div>`).join(""); }
const rnd = () => Math.floor(Math.random()*6)+1;
function randomResult(){
  let r; do { r = ""+rnd()+rnd()+rnd(); } while(r === target); // Admin ခွင့်မပြုရင် မနိုင်
  return r;
}
function spin(){
  if(busy || !gameOpen || !user || user.spins<=0 || !target) return;
  busy = true; $("spinBtn").disabled = true; $("msg").textContent = "";
  const win = !!user.force;
  const result = win ? target : randomResult();
  let t = 0;
  const iv = setInterval(()=>{ showDice(""+rnd()+rnd()+rnd()); beep(300+t*30,.05); if(++t>=15){ clearInterval(iv); finish(result, win); } }, 90);
}
function finish(result, win){
  db.ref("users/"+name).transaction(u=>{
    if(!u || u.spins<=0) return;
    u.spins--; u.result = result; u.won = win || u.won || false; if(win) u.force = false;
    return u;
  }).then(res=>{
    busy = false;
    if(res.committed){
      showDice(result);
      if(win){
        db.ref("winners/"+name).set({name, result, time: Date.now()});
        $("msg").textContent = "🏆 နိုင်ပါပြီ!"; confetti(); beep(880,.2); setTimeout(()=>beep(1175,.35),200);
      } else $("msg").textContent = "😅 မတူပါ၊ ထပ်ကြိုးစားပါ";
    }
    refreshBtn();
  }).catch(()=>{ busy=false; refreshBtn(); $("msg").textContent="⚠️ Error၊ ထပ်ကြိုးစားပါ"; });
}
if(name) authReady.then(start);
</script></body></html>
