<!DOCTYPE html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEO Dice</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:#f4f1ea;padding:16px;background:radial-gradient(circle at 20% 0,#2a1a4a 0,#0b0f1a 55%) fixed}
.w{max-width:420px;margin:auto}.logo{text-align:center;font-size:26px;letter-spacing:4px;font-weight:800;color:#f5c451;text-shadow:0 0 18px rgba(245,196,81,.45)}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(245,196,81,.28);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
input{width:100%;font-size:17px;padding:13px;border-radius:12px;border:1px solid rgba(245,196,81,.3);background:rgba(0,0,0,.35);color:#fff;margin-top:10px;outline:0}
button,.tg{display:block;width:100%;font-size:17px;padding:13px;border-radius:12px;border:0;margin-top:10px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;color:#2a1b00;background:linear-gradient(135deg,#fde08a,#f5c451 50%,#c98e1b);box-shadow:0 4px 18px rgba(245,196,81,.3)}
button:disabled{opacity:.35}.o{background:rgba(255,255,255,.1);color:#ddd;box-shadow:none;font-size:14px;padding:10px;font-weight:600}.tg{background:linear-gradient(135deg,#38b6ff,#1e88e5);color:#fff;box-shadow:0 4px 18px rgba(30,136,229,.35)}
.hide{display:none}.s{text-align:center;font-size:12px;opacity:.8;margin-top:4px}.s i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.on{background:#34d399}.off{background:#f87171}
#er{color:#f87171;text-align:center;min-height:20px;font-size:14px}
.chips{display:flex;gap:8px}.chip{flex:1;background:rgba(0,0,0,.3);border:1px solid rgba(245,196,81,.2);border-radius:14px;padding:8px 4px;text-align:center}
.chip small{display:block;font-size:10px;letter-spacing:1px;opacity:.65}.chip b{font-size:20px;color:#f5c451;word-break:break-all}
.lbl{text-align:center;font-size:12px;letter-spacing:3px;opacity:.7;margin-top:16px}
.r{display:flex;gap:10px;justify-content:center;margin:10px 0}
.d{width:78px;height:78px;background:linear-gradient(145deg,#fff,#d9d4c7);color:#1a1030;border-radius:18px;font-size:46px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 -4px 8px rgba(0,0,0,.12)}
.t .d{width:54px;height:54px;font-size:30px;border-radius:14px;background:linear-gradient(145deg,#fde08a,#c98e1b);color:#2a1b00}
.rolling .d{animation:sh .18s infinite}@keyframes sh{50%{transform:rotate(8deg) scale(1.05)}}
#m{text-align:center;font-size:21px;font-weight:800;min-height:30px;color:#f5c451}
</style></head><body>
<div class="w">
<div class="logo">🎲 LEO DICE</div><div id="st" class="s"><span id="fb">Firebase ချိတ်နေသည်...</span></div>
<div id="lg" class="card"><div style="text-align:center;opacity:.8">Admin ပေးထားတဲ့ Username ဖြင့် ဝင်ပါ</div>
<input id="un" placeholder="Username" autocapitalize="off" autocomplete="off" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">ဝင်မည်</button>
<a class="tg" href="https://t.me/LEO_Z1" target="_blank">✈️ Admin သို့ ဆက်သွယ်ရန်</a></div>
<div id="gm" class="card hide">
<div class="chips"><div class="chip"><small>USER</small><b id="me" style="font-size:15px"></b></div><div class="chip"><small>SPINS</small><b id="sp">0</b></div><div class="chip"><small>🏆 နိုင်ကြိမ်</small><b id="wn">0</b></div></div>
<div class="lbl">🎯 TARGET NUMBER</div><div class="r t" id="tg"></div>
<div class="r" id="dc"><div class="d">?</div><div class="d">?</div><div class="d">?</div></div>
<div id="m"></div><button id="sb" onclick="spin()">🎲 SPIN</button>
<a class="tg" href="https://t.me/LEO_Z1" target="_blank">✈️ Admin သို့ ဆက်သွယ်ရန်</a>
<button class="o" onclick="logout()">ထွက်မည်</button></div>
<p id="er"></p></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCzhr0A8wwApcybklGOodu6LLp-DXSqg68",authDomain:"myleogame.firebaseapp.com",databaseURL:"https://myleogame-default-rtdb.firebaseio.com",projectId:"myleogame",storageBucket:"myleogame.firebasestorage.app",messagingSenderId:"1034042569283",appId:"1:1034042569283:web:674f8df8233c5787bc1af6"};
const $=i=>document.getElementById(i);
function ld(u,cb){let i=0;(function n(){if(i>=u.length)return cb(false);const s=document.createElement("script");s.src=u[i++];s.onload=()=>cb(true);s.onerror=n;document.head.appendChild(s)})()}
const V="9.23.0",LA=["https://www.gstatic.com/firebasejs/"+V+"/firebase-app-compat.js","https://cdnjs.cloudflare.com/ajax/libs/firebase/"+V+"/firebase-app-compat.min.js","https://cdn.jsdelivr.net/npm/firebase@"+V+"/firebase-app-compat.js"];
const LD=LA.map(x=>x.replace("app-compat","database-compat"));
function fail(){$("fb").textContent="❌ Firebase မချိတ်နိုင်ပါ - Internet/VPN စစ်ပါ"}
function startFirebase(boot){ld(LA,a=>a?ld(LD,b=>b?boot():fail()):fail())}
function openDB(){try{firebase.database.INTERNAL.forceLongPolling()}catch(e){}firebase.initializeApp(firebaseConfig);return firebase.database()}
let db=null,name=localStorage.getItem("dg_user")||"",user=null,target="",busy=false,open=true,started=false;
const err=m=>$("er").textContent=m||"";
startFirebase(boot);
function boot(){db=openDB();
  db.ref(".info/connected").on("value",s=>$("st").innerHTML=s.val()?'<i class="on"></i>Online':'<i class="off"></i>Offline - ခဏစောင့်ပါ');
  if(name)start()}
async function login(){
  const n=$("un").value.trim().toLowerCase();
  if(!n)return err("Username ထည့်ပါ");
  if(!/^[a-z0-9_]+$/.test(n))return err("Username မှားနေပါတယ် (a-z, 0-9 ပဲ)");
  if(!db)return err("Firebase မချိတ်ရသေးပါ၊ ခဏစောင့်ပါ");
  err("စစ်ဆေးနေသည်...");
  try{const s=await db.ref("users/"+n).once("value");
    if(!s.exists())return err("ဒီ Username မရှိပါ");
    name=n;localStorage.setItem("dg_user",n);start();
  }catch(e){err("Error: "+(e.code||e.message))}
}
function logout(){localStorage.removeItem("dg_user");location.reload()}
function start(){
  if(started)return;started=true;err("");
  $("lg").style.display="none";$("gm").style.display="block";$("me").textContent=name;
  db.ref("config/target").on("value",s=>{target=s.val()||"";
    $("tg").innerHTML=target?[...target].map(c=>'<div class="d">'+c+'</div>').join(""):"<i>Admin မသတ်မှတ်သေးပါ</i>";btn()});
  db.ref("config/open").on("value",s=>{open=s.val()!==false;btn();if(!open)$("m").textContent="⏸ ဂိမ်းကို ခေတ္တပိတ်ထားပါတယ်";else if(!busy)$("m").textContent=""});
  db.ref("users/"+name).on("value",s=>{user=s.val();
    if(!user){logout();return}
    $("sp").textContent=user.spins||0;$("wn").textContent=user.wins||0;btn();
    if(!busy&&user.result)dice(user.result);
  },e=>err("Error: "+(e.code||e.message)));
}
const btn=()=>{$("sb").disabled=busy||!open||!user||!(user.spins>0)||!target};
const dice=r=>{$("dc").innerHTML=[...r].map(c=>'<div class="d">'+c+'</div>').join("")};
const rnd=()=>Math.floor(Math.random()*6)+1;
function beep(f,d){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function confetti(){for(let i=0;i<40;i++){const e=document.createElement("div");e.textContent=["🎉","✨","🎊","⭐"][i%4];e.style.cssText="position:fixed;top:-30px;left:"+Math.random()*100+"vw;font-size:24px;transition:transform 3s linear,opacity 3s;z-index:9";document.body.appendChild(e);requestAnimationFrame(()=>{e.style.transform="translateY(105vh)";e.style.opacity=0});setTimeout(()=>e.remove(),3500)}}
function spin(){
  if(busy||!open||!user||!(user.spins>0)||!target)return;
  busy=true;btn();err("");$("m").textContent="";$("dc").classList.add("rolling");
  const win=!!user.force;let res;
  if(win)res=target;else do{res=""+rnd()+rnd()+rnd()}while(res===target);
  let t=0;const iv=setInterval(()=>{dice(""+rnd()+rnd()+rnd());beep(300+t*30,.05);if(++t>=15){clearInterval(iv);done(res,win)}},90);
}
async function done(res,win){
  try{
    const r=await db.ref("users/"+name).transaction(u=>{if(!u||!(u.spins>0))return;u.spins--;u.result=res;if(win){u.won=true;u.force=false;u.wins=(u.wins||0)+1;u.lastWin=Date.now()}return u});
    busy=false;$("dc").classList.remove("rolling");
    if(r.committed){dice(res);
      if(win){$("m").textContent="🏆 နိုင်ပါပြီ!";confetti();beep(880,.2);setTimeout(()=>beep(1175,.35),200)}
      else $("m").textContent="😅 မတူပါ၊ ထပ်ကြိုးစားပါ";
    }
  }catch(e){busy=false;$("dc").classList.remove("rolling");err("Error: "+(e.code||e.message))}
  btn();
}
</script></body></html>
