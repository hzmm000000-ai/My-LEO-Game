<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Control Panel</title>
    <!-- Firebase SDK v9 Compact -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #fff; padding: 20px; }
        h1 { color: #38bdf8; margin-bottom: 20px; font-size: 24px; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { color: #f8b500; margin-bottom: 15px; font-size: 18px; }
        input[type="number"] { padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; text-align: center; font-size: 16px; }
        .target-box input { width: 60px; margin-right: 5px; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-success { background: #22c55e; color: #fff; }
        .btn-warning { background: #f59e0b; color: #fff; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #334155; padding: 12px; text-align: center; }
        th { background: #334155; color: #38bdf8; }
        tr:nth-child(even) { background: #182234; }

        .spin-control-group { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
        .spin-input { width: 70px !important; padding: 6px !important; font-size: 14px !important; }
        .action-btn { padding: 6px 10px; font-size: 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<h1>Admin Dashboard - Game Control</h1>

<!-- Global Target Box -->
<div class="card target-box">
    <h2>🎯 Target Numbers သတ်မှတ်ရန်</h2>
    <input type="number" id="t1" min="1" max="6" value="1">
    <input type="number" id="t2" min="1" max="6" value="2">
    <input type="number" id="t3" min="1" max="6" value="3">
    <button class="btn" onclick="setGlobalTarget()">Set Target</button>
    <span id="target-status" style="margin-left: 10px; color: #22c55e;"></span>
</div>

<!-- Users List & Control -->
<div class="card">
    <h2>👥 Members & Spin ထိန်းချုပ်မှုများ</h2>
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>လက်ရှိ Spins</th>
                    <th>Forced Status</th>
                    <th>Spins ပြင်ဆင်ရန် / ထိန်းချုပ်ရန်</th>
                </tr>
            </thead>
            <tbody id="users-table">
                <tr><td colspan="4">Loading Users List...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCzhr0A8wwApcybklGOodu6LLp-DXSqg68",
      authDomain: "myleogame.firebaseapp.com",
      databaseURL: "https://myleogame-default-rtdb.firebaseio.com",
      projectId: "myleogame",
      storageBucket: "myleogame.firebasestorage.app",
      messagingSenderId: "1034042569283",
      appId: "1:1034042569283:web:65e1273d159121f3bc1af6",
      measurementId: "G-B1YX9V3E4P"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Target ဂဏန်းများ ပြောင်းလဲရန်
    function setGlobalTarget() {
        const v1 = parseInt(document.getElementById('t1').value) || 1;
        const v2 = parseInt(document.getElementById('t2').value) || 1;
        const v3 = parseInt(document.getElementById('t3').value) || 1;

        db.ref('globalTarget').set({
            d1: v1,
            d2: v2,
            d3: v3
        }).then(() => {
            document.getElementById('target-status').innerText = '✅ Target ပြောင်းပြီးပါပြီ!';
            setTimeout(() => { document.getElementById('target-status').innerText = ''; }, 2000);
        });
    }

    // Current Target ကို ဖတ်ထားပေးမည်
    db.ref('globalTarget').on('value', (snap) => {
        const val = snap.val();
        if (val) {
            document.getElementById('t1').value = val.d1 || 1;
            document.getElementById('t2').value = val.d2 || 1;
            document.getElementById('t3').value = val.d3 || 1;
        }
    });

    // Users List ကို Realtime ဖတ်မည်
    db.ref('users').on('value', (snapshot) => {
        const users = snapshot.val();
        const tbody = document.getElementById('users-table');
        tbody.innerHTML = '';

        if (!users) {
            tbody.innerHTML = '<tr><td colspan="4">အကောင့်ဝင်ထားသူ မရှိသေးပါ။</td></tr>';
            return;
        }

        for (let username in users) {
            const uData = users[username];
            const spins = (uData.spinsLeft !== undefined) ? uData.spinsLeft : 0;
            const forced = uData.forcedDice ? `${uData.forcedDice.d1}-${uData.forcedDice.d2}-${uData.forcedDice.d3}` : 'None';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b style="color: #38bdf8; font-size: 16px;">${username}</b></td>
                <td><b style="color: #f8b500; font-size: 18px;">${spins}</b> ကြိမ်</td>
                <td><span style="color: ${uData.forcedDice ? '#22c55e' : '#aaa'};">${forced}</span></td>
                <td>
                    <div class="spin-control-group">
                        <button class="action-btn btn-success" onclick="addSpins('${username}', 1)">+1 Spin</button>
                        <button class="action-btn btn-success" onclick="addSpins('${username}', 5)">+5 Spins</button>
                        <input type="number" id="spin-input-${username}" class="spin-input" placeholder="အကြိမ်" min="0">
                        <button class="action-btn btn" onclick="setCustomSpin('${username}')">Set</button>
                        <button class="action-btn btn-danger" onclick="setCustomSpinValue('${username}', 0)">Set 0</button>
                        <button class="action-btn btn-warning" onclick="setForce('${username}')">Force Win</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        }
    });

    function addSpins(user, count) {
        db.ref('users/' + user + '/spinsLeft').transaction(s => (s || 0) + count);
    }

    function setCustomSpin(user) {
        const input = document.getElementById(`spin-input-${user}`);
        const val = parseInt(input.value);
        if (isNaN(val) || val < 0) {
            alert('ကျေးဇူးပြု၍ ဂဏန်း ရိုက်ထည့်ပါ');
            return;
        }
        setCustomSpinValue(user, val);
        input.value = '';
    }

    function setCustomSpinValue(user, value) {
        db.ref('users/' + user + '/spinsLeft').set(value);
    }

    function setForce(user) {
        db.ref('globalTarget').once('value', (snap) => {
            const target = snap.val() || { d1: 1, d2: 2, d3: 3 };
            db.ref('users/' + user + '/forcedDice').set(target);
            alert(user + ' ကို Force Win သတ်မှတ်လိုက်ပါပြီ။');
        });
    }
</script>

</body>
</html>
