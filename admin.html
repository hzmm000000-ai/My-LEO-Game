<!DOCTYPE html>
<html lang="my"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#f1f5f9;padding:14px}
.box{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:14px}
input,button{font-size:16px;padding:9px;border-radius:8px;border:0;margin:3px 0}
button{background:#f59e0b;font-weight:700;cursor:pointer}
.d{background:#ef4444;color:#fff}.g{background:#10b981;color:#fff}
.t input{width:44px;text-align:center;font-size:24px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 3px;border-bottom:1px solid #334155;font-size:14px;text-align:left}
.hide{display:none}
</style></head><body>
<div id="lock" class="box"><h3>Admin Login</h3>
<input id="em" type="email" placeholder="Admin Email"><br><input id="pin" type="password" placeholder="Password"><br><button onclick="unlock()">ဝင်မည်</button><span id="err"></span></div>

<div id="panel" class="hide">
<div class="box t"><h3>🎯 Target Number (1-6)</h3>
<input id="t1" maxlength="1"> <input id="t2" maxlength="1"> <input id="t3" maxlength="1">
<button onclick="setTarget()">သတ်မှတ်မည်</button><div>လက်ရှိ: <b id="cur">-</b></div></div>

<div class="box"><h3>🎮 ဂိမ်းအခြေအနေ</h3><button id="openBtn" onclick="toggleOpen()">-</button>
<button class="d" onclick="resetAll()">အားလုံး Reset (spins=0, ရလဒ်ရှင်း)</button></div>

<div class="box"><h3>👥 Username (<span id="cnt">0</span>/30)</h3>
<input id="nu" placeholder="Username အသစ်"> <input id="ns" type="number" value="3" style="width:60px"> spins
<button onclick="addUser()">ထည့်မည်</button>
<button class="g" onclick="allSpins(1)">အားလုံး +1 spin</button>
<table id="tbl"></table></div>

<div class="box"><h3>🏆 နိုင်သူများ</h3><table id="win"></table>
<button class="d" onclick="clearWinners()">စာရင်းရှင်းမည်</button></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
// ▼▼ index.html ထဲက config အတိုင်း ထည့်ပါ ▼▼
const firebaseConfig = {
  apiKey: "AIzaSyCzhr0A8wwApcybklGOodu6LLp-DXSqg68",
  authDomain: "myleogame.firebaseapp.com",
  databaseURL: "https://myleogame-default-rtdb.firebaseio.com",
  projectId: "myleogame",
  storageBucket: "myleogame.firebasestorage.app",
  messagingSenderId: "1034042569283",
  appId: "1:1034042569283:web:674f8df8233c5787bc1af6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database(), $ = id => document.getElementById(id);
let users = {};

function unlock(){
  firebase.auth().signInWithEmailAndPassword($("em").value.trim(), $("pin").value)
    .catch(()=>{ $("err").textContent=" Email/Password မှားနေပါတယ်"; });
}
firebase.auth().onAuthStateChanged(u=>{
  if(u && !u.isAnonymous){ $("lock").classList.add("hide"); $("panel").classList.remove("hide"); init(); }
});
let isOpen=true;
function toggleOpen(){ db.ref("config/open").set(!isOpen); }
function resetAll(){ if(!confirm("Reset လုပ်မလား?")) return; Object.keys(users).forEach(n=>db.ref("users/"+n).update({spins:0,force:false,won:false,result:""})); db.ref("winners").remove(); }
function init(){
  db.ref("config/open").on("value", s=>{ isOpen = s.val()!==false; $("openBtn").textContent = isOpen?"🟢 ဖွင့်ထား (နှိပ်ရင်ပိတ်)":"🔴 ပိတ်ထား (နှိပ်ရင်ဖွင့်)"; });
  db.ref("config/target").on("value", s=> $("cur").textContent = s.val() || "-");
  db.ref("users").on("value", s=>{ users = s.val() || {}; render(); });
  db.ref("winners").on("value", s=>{
    const w = s.val() || {};
    $("win").innerHTML = "<tr><th>User</th><th>ရလဒ်</th><th>အချိန်</th></tr>" +
      Object.values(w).sort((a,b)=>b.time-a.time).map(x=>`<tr><td>${x.name}</td><td>${x.result}</td><td>${new Date(x.time).toLocaleString()}</td></tr>`).join("");
  });
}
function setTarget(){
  const v = $("t1").value+$("t2").value+$("t3").value;
  if(!/^[1-6]{3}$/.test(v)) return alert("၁ မှ ၆ ကြား ဂဏန်း ၃ လုံး ထည့်ပါ");
  db.ref("config/target").set(v);
}
function addUser(){
  const n = $("nu").value.trim().toLowerCase();
  if(!/^[a-z0-9_]+$/.test(n)) return alert("အင်္ဂလိပ်စာလုံး/ဂဏန်းပဲ သုံးပါ");
  if(users[n]) return alert("ရှိပြီးသား");
  if(Object.keys(users).length >= 30) return alert("Username 30 ပြည့်ပါပြီ");
  db.ref("users/"+n).set({spins: +$("ns").value||0, force:false, won:false, result:""});
  $("nu").value="";
}
function render(){
  const k = Object.keys(users); $("cnt").textContent = k.length;
  $("tbl").innerHTML = "<tr><th>User</th><th>Spins</th><th>ရလဒ်</th><th>နိုင်စေ</th><th></th></tr>" +
    k.map(n=>{const u=users[n];return `<tr>
    <td>${n}${u.won?" 🏆":""}</td>
    <td><button onclick="addSpin('${n}',-1)">-</button> ${u.spins||0} <button onclick="addSpin('${n}',1)">+</button></td>
    <td>${u.result||"-"}</td>
    <td><button class="${u.force?'g':''}" onclick="toggleForce('${n}')">${u.force?'ON':'OFF'}</button></td>
    <td><button class="d" onclick="del('${n}')">✕</button></td></tr>`}).join("");
}
function addSpin(n,d){ db.ref(`users/${n}/spins`).transaction(v=>Math.max(0,(v||0)+d)); }
function toggleForce(n){ db.ref(`users/${n}/force`).set(!users[n].force); }
function del(n){ if(confirm(n+" ဖျက်မလား?")){ db.ref("users/"+n).remove(); db.ref("winners/"+n).remove(); } }
function allSpins(d){ Object.keys(users).forEach(n=>addSpin(n,d)); }
function clearWinners(){ db.ref("winners").remove(); Object.keys(users).forEach(n=>db.ref(`users/${n}`).update({won:false,force:false})); }
</script></body></html>
