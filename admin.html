<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Dice Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .admin-card { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 650px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 25px; }
        h1, h2 { color: #38bdf8; margin-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
        .inputs-row { display: flex; gap: 10px; }
        input[type="number"], input[type="text"] { width: 100%; padding: 10px; background: #334155; border: 1px solid #475569; color: #fff; border-radius: 6px; font-size: 16px; text-align: center; }
        button { width: 100%; background: #0284c7; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .btn-target { background: #059669; }
        .btn-target:hover { background: #047857; }
        .status { margin-top: 10px; text-align: center; color: #22c55e; font-weight: bold; }
        
        .logs-card { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 650px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #38bdf8; }
        .badge-win { background: #22c55e; color: #000; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-lose { background: #ef4444; color: #fff; padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>

<!-- Global Target Number Config -->
<div class="admin-card">
    <h1>Global Target Number Setup</h1>
    <div class="form-group">
        <label>Target Numbers (ဂိမ်းနိုင်ရန် တူရမည့် ဂဏန်း ၃ လုံး)</label>
        <div class="inputs-row">
            <input type="number" id="t1" min="1" max="6" value="1">
            <input type="number" id="t2" min="1" max="6" value="2">
            <input type="number" id="t3" min="1" max="6" value="3">
        </div>
    </div>
    <button onclick="saveGlobalTarget()">Save Target Numbers</button>
    <div class="status" id="global-status"></div>
</div>

<!-- Specific User Settings (Spins & Control Outcome) -->
<div class="admin-card" style="border: 2px solid #38bdf8;">
    <h2 style="color: #f8b500;">User Specific Setup & Control</h2>

    <div class="form-group">
        <label>Target Username (မန်ဘာ၏ Username)</label>
        <input type="text" id="target-username" placeholder="e.g. mgmg">
    </div>

    <div class="form-group">
        <label>Set Allowed Spins Count (အဆိုပါ Member လှည့်ခွင့် အကြိမ်ရေ)</label>
        <input type="number" id="user-spins" min="1" value="5">
    </div>

    <div class="form-group">
        <label>Forced Dice Outcome (Optional: ကျစေချင်သည့် ဂဏန်း ၃ လုံး)</label>
        <div class="inputs-row">
            <input type="number" id="u1" min="1" max="6" placeholder="D1">
            <input type="number" id="u2" min="1" max="6" placeholder="D2">
            <input type="number" id="u3" min="1" max="6" placeholder="D3">
        </div>
    </div>

    <button class="btn-target" onclick="saveUserConfig()">Save User Settings</button>
    <div class="status" id="user-status"></div>
</div>

<!-- Active User Configurations List -->
<div class="logs-card">
    <h2>User Allocations & Configs</h2>
    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th>Spins Left</th>
                <th>Forced Dice</th>
            </tr>
        </thead>
        <tbody id="user-configs-body"></tbody>
    </table>
</div>

<!-- Live Logs & Winner Table -->
<div class="logs-card">
    <h2>Live Game Logs & Winners</h2>
    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th>Rolled</th>
                <th>Status</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody id="logs-table-body"></tbody>
    </table>
    <button onclick="clearLogs()" style="margin-top: 15px; background: #dc2626;">Clear Game Logs</button>
</div>

<script>
    function getAdminData() {
        const data = localStorage.getItem('diceGameAdmin');
        return data ? JSON.parse(data) : { target: [1, 2, 3], userSettings: {} };
    }

    function loadAdminSettings() {
        const parsed = getAdminData();
        document.getElementById('t1').value = parsed.target[0] || 1;
        document.getElementById('t2').value = parsed.target[1] || 2;
        document.getElementById('t3').value = parsed.target[2] || 3;
        renderUserConfigs();
    }

    function saveGlobalTarget() {
        let adminData = getAdminData();
        adminData.target = [
            parseInt(document.getElementById('t1').value) || 1,
            parseInt(document.getElementById('t2').value) || 1,
            parseInt(document.getElementById('t3').value) || 1
        ];

        localStorage.setItem('diceGameAdmin', JSON.stringify(adminData));
        showStatus('global-status', 'Target numbers updated!');
    }

    function saveUserConfig() {
        const username = document.getElementById('target-username').value.trim();
        const spins = parseInt(document.getElementById('user-spins').value) || 0;

        const u1 = parseInt(document.getElementById('u1').value);
        const u2 = parseInt(document.getElementById('u2').value);
        const u3 = parseInt(document.getElementById('u3').value);

        if(!username) {
            alert('Username ထည့်ပေးပါ။');
            return;
        }

        let adminData = getAdminData();
        if(!adminData.userSettings) adminData.userSettings = {};

        let forced = (u1 && u2 && u3) ? [u1, u2, u3] : null;

        adminData.userSettings[username] = {
            spinsLeft: spins,
            forcedDice: forced
        };

        localStorage.setItem('diceGameAdmin', JSON.stringify(adminData));

        showStatus('user-status', `Settings updated for "${username}"!`);
        
        // Reset Inputs
        document.getElementById('target-username').value = '';
        document.getElementById('u1').value = '';
        document.getElementById('u2').value = '';
        document.getElementById('u3').value = '';

        renderUserConfigs();
    }

    function renderUserConfigs() {
        const adminData = getAdminData();
        const tbody = document.getElementById('user-configs-body');
        tbody.innerHTML = '';

        if (adminData.userSettings) {
            for (let user in adminData.userSettings) {
                const config = adminData.userSettings[user];
                const tr = document.createElement('tr');
                const forcedText = config.forcedDice ? config.forcedDice.join(' - ') : 'None (Random)';

                tr.innerHTML = `
                    <td style="color: #38bdf8; font-weight: bold;">${user}</td>
                    <td>${config.spinsLeft}</td>
                    <td>${forcedText}</td>
                `;
                tbody.appendChild(tr);
            }
        }
    }

    function showStatus(elementId, msg) {
        const status = document.getElementById(elementId);
        status.innerText = msg;
        setTimeout(() => { status.innerText = ""; }, 3000);
    }

    function loadLogs() {
        const logs = JSON.parse(localStorage.getItem('diceGameLogs')) || [];
        const tbody = document.getElementById('logs-table-body');
        tbody.innerHTML = '';

        logs.forEach(log => {
            const tr = document.createElement('tr');
            const statusBadge = log.status === 'WIN' 
                ? `<span class="badge-win">WIN (Matched)</span>` 
                : `<span class="badge-lose">LOSE</span>`;

            tr.innerHTML = `
                <td style="color: #38bdf8; font-weight: bold;">${log.username}</td>
                <td>${log.rolled}</td>
                <td>${statusBadge}</td>
                <td>${log.time}</td>
            `;
            tbody.appendChild(tr);
        });
        
        // Refresh User configs display too
        renderUserConfigs();
    }

    function clearLogs() {
        localStorage.removeItem('diceGameLogs');
        loadLogs();
    }

    window.addEventListener('storage', loadLogs);

    loadAdminSettings();
    loadLogs();
</script>

</body>
</html>
