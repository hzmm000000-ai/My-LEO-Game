<!DOCTYPE html>
<html lang="my"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#f1f5f9;padding:12px}
.b{background:#1e293b;border-radius:12px;padding:12px;margin-bottom:12px}
input,button{font-size:16px;padding:9px;border-radius:8px;border:0;margin:3px 0}
button{background:#f59e0b;font-weight:700}.d{background:#ef4444;color:#fff}.g{background:#10b981;color:#fff}
.t input{width:44px;text-align:center;font-size:24px}
table{width:100%;border-collapse:collapse}td,th{padding:5px 2px;border-bottom:1px solid #334155;font-size:14px;text-align:left}
.h{display:none}h3{margin:0 0 6px}#lk{word-break:break-all;color:#38bdf8;font-size:14px}
</style></head><body>
<div id="lock" class="b"><h3>Admin Login</h3>
<input id="pw" type="password" placeholder="Admin PIN"><br>
<button onclick="login()">ဝင်မည်</button> <span id="er" style="color:#f87171"></span></div>
<div id="pn" class="h">
<div class="b"><h3>🔗 Player Link (Member တွေကို ပေးရန်)</h3><div id="lk"></div><button onclick="cp()">Copy</button></div>
<div class="b t"><h3>🎯 Target (1-6)</h3><input id="t1" maxlength="1" inputmode="numeric"> <input id="t2" maxlength="1" inputmode="numeric"> <input id="t3" maxlength="1" inputmode="numeric">
<button onclick="setT()">သတ်မှတ်မည်</button><div>လက်ရှိ: <b id="cur">-</b></div></div>
<div class="b"><h3>🎮 ဂိမ်း</h3><button id="ob" onclick="tog()">-</button> <button class="d" onclick="rst()">Reset အားလုံး</button></div>
<div class="b"><h3>👥 Username (<span id="cn">0</span>/30)</h3>
<input id="nu" placeholder="username (a-z,0-9)" style="width:42%"> <input id="ns" type="number" value="3" style="width:56px"> spins
<button onclick="add()">ထည့်</button><br>
<button class="g" onclick="bulk()">user01-user30 တစ်ခါတည်းဆောက်</button>
<button class="g" onclick="allS(1)">အားလုံး +1 spin</button>
<table id="tb"></table></div>
<div class="b"><h3>🏆 နိုင်သူများ</h3><table id="wn"></table><button class="d" onclick="cw()">စာရင်းရှင်း</button></div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCzhr0A8wwApcybklGOodu6LLp-DXSqg68",authDomain:"myleogame.firebaseapp.com",databaseURL:"https://myleogame-default-rtdb.firebaseio.com",projectId:"myleogame",storageBucket:"myleogame.firebasestorage.app",messagingSenderId:"1034042569283",appId:"1:1034042569283:web:674f8df8233c5787bc1af6"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database(),$=i=>document.getElementById(i);
let users={},isOpen=true,inited=false;
const f=e=>alert("❌ "+e.code+"\nFirebase Rules ကို စစ်ပါ");
const ADMIN_PIN="8888";
function login(){if($("pw").value!==ADMIN_PIN)return $("er").textContent="PIN မှားနေပါတယ်";inited=true;$("lock").style.display="none";$("pn").style.display="block";init()}
function init(){
  $("lk").textContent=location.href.replace(/admin\.html.*$/,"");
  db.ref("config/target").on("value",s=>$("cur").textContent=s.val()||"-");
  db.ref("config/open").on("value",s=>{isOpen=s.val()!==false;$("ob").textContent=isOpen?"🟢 ဖွင့်ထား (နှိပ်ရင်ပိတ်)":"🔴 ပိတ်ထား (နှိပ်ရင်ဖွင့်)"});
  db.ref("users").on("value",s=>{users=s.val()||{};render()},e=>alert("Error: "+e.code+" (Rules ထဲ Admin email စစ်ပါ)"));
  db.ref("winners").on("value",s=>{const w=Object.values(s.val()||{}).sort((a,b)=>b.time-a.time);
    $("wn").innerHTML="<tr><th>User</th><th>ရလဒ်</th><th>အချိန်</th></tr>"+w.map(x=>"<tr><td>"+x.name+"</td><td>"+x.result+"</td><td>"+new Date(x.time).toLocaleTimeString()+"</td></tr>").join("")});
}
function cp(){navigator.clipboard&&navigator.clipboard.writeText($("lk").textContent);alert("Copy ပြီး")}
function setT(){const v=$("t1").value+$("t2").value+$("t3").value;if(!/^[1-6]{3}$/.test(v))return alert("၁ မှ ၆ ကြား ဂဏန်း ၃ လုံး");db.ref("config/target").set(v).then(()=>alert("✅ Target သတ်မှတ်ပြီး")).catch(f)}
function tog(){db.ref("config/open").set(!isOpen).catch(f)}
function mk(n,sp){return db.ref("users/"+n).set({spins:sp,force:false,won:false,result:""}).catch(f)}
function add(){const n=$("nu").value.trim().toLowerCase();
  if(!/^[a-z0-9_]+$/.test(n))return alert("a-z 0-9 ပဲသုံးပါ");if(users[n])return alert("ရှိပြီးသား");
  if(Object.keys(users).length>=30)return alert("၃၀ ပြည့်ပြီ");mk(n,+$("ns").value||0).then(()=>{$("nu").value="";alert("✅ "+n+" ထည့်ပြီး")})}
function bulk(){let c=Object.keys(users).length;for(let i=1;i<=30&&c<30;i++){const k="user"+String(i).padStart(2,"0");if(!users[k]){mk(k,+$("ns").value||0);c++}}}
function render(){const k=Object.keys(users).sort();$("cn").textContent=k.length;
  $("tb").innerHTML="<tr><th>User</th><th>Spins</th><th>ရလဒ်</th><th>နိုင်စေ</th><th></th></tr>"+k.map(n=>{const u=users[n];
  return "<tr><td>"+n+(u.won?" 🏆":"")+"</td><td><button onclick=\"sp('"+n+"',-1)\">-</button> "+(u.spins||0)+" <button onclick=\"sp('"+n+"',1)\">+</button></td><td>"+(u.result||"-")+"</td><td><button class=\""+(u.force?"g":"")+"\" onclick=\"fc('"+n+"')\">"+(u.force?"ON":"OFF")+"</button></td><td><button class=\"d\" onclick=\"dl('"+n+"')\">✕</button></td></tr>"}).join("")}
function sp(n,d){db.ref("users/"+n+"/spins").transaction(v=>Math.max(0,(v||0)+d)).catch(f)}
function fc(n){db.ref("users/"+n+"/force").set(!users[n].force).catch(f)}
function dl(n){if(confirm(n+" ဖျက်မလား?")){db.ref("users/"+n).remove();db.ref("winners/"+n).remove()}}
function allS(d){Object.keys(users).forEach(n=>sp(n,d))}
function cw(){db.ref("winners").remove();Object.keys(users).forEach(n=>db.ref("users/"+n).update({won:false,force:false}))}
function rst(){if(!confirm("Reset လုပ်မလား?"))return;Object.keys(users).forEach(n=>mk(n,0));db.ref("winners").remove()}
</script></body></html>
